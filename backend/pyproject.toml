[project]
name = "branch-opening-platform"
version = "0.1.0"
description = "Branch Opening Management Platform backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.10,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9.0",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
